    "typer>=0.23.2",
    "uvicorn>=0.42.0",
    "weaviate-client[agents]>=4.20.4",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]

[project.scripts]
altnl = "splitpdf.main:app"
