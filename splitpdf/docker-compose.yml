services:
  tika:
    image: apache/tika:latest-full
    container_name: tika
    ports:
      - "127.0.0.1:9998:9998"
    restart: on-failure

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.24.1
    container_name: weaviate
    ports:
      - "8887:8080"
      - "50051:50051"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      QUERY_DEFAULTS_LIMIT: 25
      DEFAULT_VECTORIZER_MODULE: 'none' # Since no vectorizer service was in your run command
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: on-failure

volumes:
  weaviate_data: